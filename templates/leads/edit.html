{% extends "base.html" %}
{% block title %}Edit Lead: {{ lead.name }} — Mini CRM{% endblock %}
{% block page_title %}Edit Lead{% endblock %}

{% block content %}
<div class="form-card">
  <div id="error-box" style="display:none; background: var(--danger-bg); color: var(--danger); padding: 0.85rem; border-radius: 6px; margin-bottom: 1.25rem;"></div>

  <form id="lead-edit-form">
    <div class="form-group">
      <label class="form-label" for="name">Lead Name *</label>
      <input type="text" id="name" name="name" class="form-control" value="{{ lead.name }}" required>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" class="form-control" value="{{ lead.phone }}">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ lead.email }}">
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label class="form-label" for="source">Acquisition Source *</label>
        <input type="text" id="source" name="source" class="form-control" value="{{ lead.source }}" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="status">Status *</label>
        <select id="status" name="status" class="form-control">
          {% for val, label in statuses %}
          <option value="{{ val }}" {% if lead.status == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="note">Notes & Context</label>
      <textarea id="note" name="note" class="form-control" rows="4">{{ lead.note }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" id="submit-btn" class="btn btn-primary">Save Changes via API</button>
      <a href="{% url 'lead_detail' lead.id %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  const leadId = {{ lead.id }};
  document.getElementById('lead-edit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');
    errorBox.style.display = 'none';

    const payload = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      source: document.getElementById('source').value.trim(),
      status: document.getElementById('status').value,
      note: document.getElementById('note').value.trim(),
    };

    submitBtn.disabled = true;
    submitBtn.innerText = 'Saving via API...';

    try {
      const res = await window.apiFetch(`/api/v1/leads/${leadId}/`, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = `/leads/${leadId}/`;
      } else {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Save Changes via API';
        errorBox.style.display = 'block';
        let msgs = [];
        for (let key in data) {
          msgs.push(`<strong>${key}:</strong> ${Array.isArray(data[key]) ? data[key].join(', ') : data[key]}`);
        }
        errorBox.innerHTML = msgs.join('<br>');
      }
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Save Changes via API';
      errorBox.style.display = 'block';
      errorBox.innerText = 'Network error or server unavailable.';
    }
  });
</script>
{% endblock %}
