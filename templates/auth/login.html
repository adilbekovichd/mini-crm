{% extends "base.html" %}
{% block title %}Sign In — Mini CRM{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.75rem; font-weight: 700;">Mini CRM</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to your CRM workspace</p>
    </div>

    {% if form.errors %}
    <div style="background: var(--danger-bg); color: var(--danger); padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem;">
      Invalid username or password. Please try again.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" required autofocus placeholder="e.g. admin">
      </div>
      <div class="form-group">
        <label class="form-label" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Sign In</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
      Backend Assessment • Django REST Framework
    </div>
  </div>
</div>
{% endblock %}
